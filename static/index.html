<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diwan al-Wathaiq</title>
<meta name="description" content="Transcription of Maghrebi-script court deeds from Algiers with Gemini and expert review">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-10 -10 20 20'%3E%3Crect x='-6' y='-6' width='12' height='12' fill='%2316684e'/%3E%3Crect x='-6' y='-6' width='12' height='12' fill='%2316684e' transform='rotate(45)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Reem+Kufi:wght@400..700&display=swap">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- eight-pointed star (najma thumaniyya), the zellige motif of Maghrebi tilework -->
    <pattern id="zl" width="28" height="22" patternUnits="userSpaceOnUse">
      <rect class="zl-bg" width="28" height="22"/>
      <g transform="translate(14 11)">
        <rect class="zl-a" x="-6" y="-6" width="12" height="12"/>
        <rect class="zl-a" x="-6" y="-6" width="12" height="12" transform="rotate(45)"/>
        <circle class="zl-b" r="2.6"/>
      </g>
      <path class="zl-c" d="M0 0 h3 l-3 3z M28 0 h-3 l3 3z M0 22 h3 l-3 -3z M28 22 h-3 l3 -3z"/>
    </pattern>
    <symbol id="i-star" viewBox="-10 -10 20 20">
      <rect class="star" x="-6" y="-6" width="12" height="12"/>
      <rect class="star" x="-6" y="-6" width="12" height="12" transform="rotate(45)"/>
    </symbol>
  </defs>
</svg>

<svg class="band" aria-hidden="true"><rect width="100%" height="22" fill="url(#zl)"/></svg>
<header class="top">
  <div class="wrap">
    <div class="head">
      <svg class="seal" viewBox="0 0 64 64" role="img" aria-label="Seal">
        <polygon class="s-out" points="32,2 58,17 58,47 32,62 6,47 6,17"/>
        <polygon class="s-in" points="32,7 54,19.5 54,44.5 32,57 10,44.5 10,19.5"/>
        <text x="32" y="33" text-anchor="middle" font-size="15" font-weight="700">ديوان</text>
        <text x="32" y="48" text-anchor="middle" font-size="9.5">١٢٥٧</text>
      </svg>
      <div class="brand">
        <h1 id="appName">ديوان الوثائق</h1>
        <p id="tagline"></p>
      </div>
      <div class="head-side">
        <span class="date-chip" id="dateChip"></span>
        <button class="lang" id="langBtn" type="button">English</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>

<main class="wrap" id="main">
  <div id="notices"></div>
  <section id="view-pages"></section>
  <section id="view-review" hidden></section>
  <section id="view-library" hidden></section>
  <section id="view-register" hidden></section>
</main>

<footer>
  <div class="wrap">
    <span id="footL"></span>
    <span id="footR"></span>
  </div>
</footer>
<div class="toast" id="toast" hidden></div>

<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <svg class="seal" viewBox="0 0 64 64" style="margin:0 auto" aria-hidden="true">
      <polygon class="s-out" points="32,2 58,17 58,47 32,62 6,47 6,17"/>
      <polygon class="s-in" points="32,7 54,19.5 54,44.5 32,57 10,44.5 10,19.5"/>
      <text x="32" y="33" text-anchor="middle" font-size="15" font-weight="700">ديوان</text>
      <text x="32" y="48" text-anchor="middle" font-size="9.5">١٢٥٧</text>
    </svg>
    <h2 id="loginTitle">ادخل إلى الديوان</h2>
    <p class="muted small" id="loginSub" style="margin:0"></p>
    <label class="small" id="pwLabel" for="pw">كلمة المرور</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn primary" type="submit" id="loginBtn">ادخل</button>
    <div class="err" id="loginErr" aria-live="polite"></div>
  </form>
</div>
<script src="static/app.js"></script>
</body>
</html>
