# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Render Blueprint: two free services.
#   diwan-htr        the transcription app (password-protected), built from this repo's Dockerfile.
#   diwan-alwathaiq  the public presentation site (welcome, demo, pitch): plain files from docs/
#                    on the "website" branch. Static, no keys, served from a CDN and never sleeps.
# Deploy: Render dashboard → New → Blueprint → pick this repo → fill in the values it asks for → Apply.
# Keys and passwords are never stored here: "sync: false" makes Render ask for them once.

services:
  - type: web
    name: diwan-htr
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Deploy only commits whose GitHub checks (the pytest job) passed.
    autoDeployTrigger: checksPass
    envVars:
      # Required
      - key: GEMINI_API_KEY        # from https://aistudio.google.com/apikey
        sync: false
      - key: APP_PASSWORD          # website password; without it the site is open to anyone
        sync: false
      - key: APP_SECRET            # signs logins, so they survive restarts
        generateValue: true
      # Google Drive (recommended on Render: its disk is wiped whenever the service sleeps)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: HTR_TRAIN_FOLDER
        sync: false
      - key: HTR_INBOX_FOLDER
        sync: false
      - key: HTR_OUTPUT_FOLDER
        sync: false
      # Where the app keeps its working files inside the container
      - key: HTR_DATA
        value: /home/user/data

  - type: web
    name: diwan-alwathaiq
    runtime: static
    branch: website
    buildCommand: echo "Static site, nothing to build"
    staticPublishPath: ./docs
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - docs/**
    headers:
      # Pages and the offline cache script are always revalidated; fonts never change.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
